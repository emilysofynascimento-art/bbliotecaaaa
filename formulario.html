
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Empréstimo de Livros</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>BIBLIOTECA</h1>
    </header>

    <main>

        <form id="form" onsubmit="enviarPedido(event)">

            <h2>Pedir Empréstimo</h2>

            <div class="campo">
                <label for="nome">Nome do Aluno <span class="marcador">*</span></label>
                <input type="text" id="nome" placeholder="Digite seu nome" required>
            </div>

            <div class="campo">
                <label for="turma">Turma <span class="marcador">*</span></label>
                <input type="text" id="turma" placeholder="Digite sua turma" required>
            </div>

            <div class="campo">
                <label for="livro">Livro Escolhido <span class="marcador">*</span></label>
                <input type="text" id="livro" placeholder="Livro escolhido" required readonly>
            </div>

            <button type="submit">PEDIR</button>

            <p class="voltar">
                <a href="index.html">Voltar para os livros</a>
            </p>

        </form>

    </main>

    <footer>
        <p>emy sofy e aninha fazendeira</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
